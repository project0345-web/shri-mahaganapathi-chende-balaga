<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Chende | Shri Mahaganapathi Chende Balaga</title><link rel="stylesheet" href="css/style.css"></head><body><main class="booking standalone-booking"><div class="booking-grid"><div><p class="eyebrow">SHRI MAHAGANAPATHI CHENDE BALAGA</p><h1>Book <span>Chende</span></h1><p class="muted">Send your event details. Our team will review your request and contact you to confirm the booking.</p><a class="text-link" href="index.html">← Back to website</a><br><a class="text-link" href="status.html">Check an existing booking →</a></div><form id="bookingForm" class="form"><div class="two"><label>Full Name<input name="customer_name" required placeholder="Your name"></label><label>Phone<input name="phone" required placeholder="Mobile number"></label></div><div class="two"><label>Email <span class="optional">(Optional)</span><input name="email" type="email" placeholder="your@email.com"></label><label>Event Type<select name="event_type" required><option value="">Select</option><option>Wedding</option><option>Bhajan</option><option>Procession</option><option>Temple Event</option><option>Cultural Program</option><option>Other</option></select></label></div><div class="two"><label>Event Date<input name="event_date" type="date" required></label><label>Start Time<input name="start_time" type="time" required></label></div><label>Venue / Location<input name="location" required placeholder="Venue and town"></label><label>Additional Requirements<textarea name="message" rows="4" placeholder="Tell us about your event..."></textarea></label><button class="gold" type="submit" id="bookingSubmit">Submit Booking Request ↗</button><p id="bookingMsg" role="status"></p><div id="bookingServiceStatus" class="booking-service-status"><span class="dot"></span><span>Checking booking service…</span></div></form></div></main><script src="js/main.js"></script></body></html>

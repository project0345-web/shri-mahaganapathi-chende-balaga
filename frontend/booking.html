<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>
    Book Chende | Shri Mahaganapathi Chende Balaga
  </title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="booking standalone-booking">

    <div class="booking-grid">

      <!-- LEFT SIDE -->
      <div>

        <p class="eyebrow">
          SHRI MAHAGANAPATHI CHENDE BALAGA
        </p>

        <h1>
          Book <span>Chende</span>
        </h1>

        <p class="muted">
          Send your event details. Our team will review
          your request and contact you to confirm the booking.
        </p>

        <a class="text-link" href="index.html">
          ← Back to website
        </a>

        <br>

        <a class="text-link" href="status.html">
          Check an existing booking →
        </a>

      </div>


      <!-- BOOKING FORM -->
      <form id="bookingForm" class="form">

        <!-- NAME + PHONE -->
        <div class="two">

          <label>
            Full Name

            <input
              name="customer_name"
              required
              placeholder="Your name"
            >

          </label>


          <label>
            Phone

            <input
              name="phone"
              type="tel"
              required
              placeholder="Mobile number"
            >

          </label>

        </div>


        <!-- EMAIL + EVENT TYPE -->
        <div class="two">

          <label>
            Email
            <span class="optional">
              (Optional)
            </span>

            <input
              name="email"
              type="email"
              placeholder="your@email.com"
            >

          </label>


          <label>
            Event Type

            <select
              name="event_type"
              required
            >

              <option value="">
                Select
              </option>

              <option>
                Wedding
              </option>

              <option>
                Bhajan
              </option>

              <option>
                Procession
              </option>

              <option>
                Temple Event
              </option>

              <option>
                Cultural Program
              </option>

              <option>
                Other
              </option>

            </select>

          </label>

        </div>


        <!-- DATE + TIME -->
        <div class="two">

          <label>
            Event Date

            <input
              name="event_date"
              type="date"
              required
            >

          </label>


          <label>
            Start Time

            <input
              name="start_time"
              type="time"
              required
            >

          </label>

        </div>


        <!-- VENUE NAME -->
        <label>

          Venue / Location

          <input
            name="location"
            required
            placeholder="Enter venue name and town"
          >

        </label>


        <!-- GOOGLE MAPS -->
        <label>

          Google Maps Location
          <span class="optional">
            (Required)
          </span>

          <div
            style="
              display:flex;
              gap:10px;
              align-items:stretch;
              flex-wrap:wrap;
            "
          >

            <input
              id="googleMapsLink"
              name="google_maps_link"
              type="url"
              required
              placeholder="Paste Google Maps link here"
              style="flex:1;min-width:220px;"
            >

            <a
              href="https://www.google.com/maps"
              target="_blank"
              rel="noopener noreferrer"
              class="text-link"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                padding:0 14px;
                border:1px solid currentColor;
                border-radius:8px;
                white-space:nowrap;
              "
            >
              Select on Google Maps ↗
            </a>

          </div>

          <small
            class="muted"
            style="display:block;margin-top:7px;"
          >
            Enter the venue name above, click
            <strong>Select on Google Maps</strong>,
            find the venue, copy the Google Maps link,
            then paste it here.
          </small>

        </label>


        <!-- MESSAGE -->
        <label>

          Additional Requirements

          <textarea
            name="message"
            rows="4"
            placeholder="Tell us about your event..."
          ></textarea>

        </label>


        <!-- SUBMIT -->
        <button
          class="gold"
          type="submit"
          id="bookingSubmit"
        >
          Submit Booking Request ↗
        </button>


        <!-- MESSAGE -->
        <p
          id="bookingMsg"
          role="status"
        ></p>


        <!-- SERVICE STATUS -->
        <div
          id="bookingServiceStatus"
          class="booking-service-status"
        >

          <span class="dot"></span>

          <span>
            Checking booking service…
          </span>

        </div>

      </form>

    </div>

  </main>


  <script src="js/main.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Chende - Shri Mahaganapathi Chende Balaga</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="loader">
    <div class="loader-content">
        <img src="assets/logo.jpg" alt="Shri Mahaganapathi Chende Balaga">
        <p>Loading...</p>
    </div>
</div>

<header class="header">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            Shri Mahaganapathi Chende Balaga
        </a>

        <button class="menu-toggle" id="menuToggle" type="button">
            ☰
        </button>

        <nav class="nav" id="navMenu">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#team">Team</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="booking.html" class="active">Book Now</a>
        </nav>

        <button id="themeToggle" class="theme-toggle" type="button">
            ◐
        </button>

    </div>

</header>

<main>

    <section class="booking-section">

        <div class="container">

            <div class="section-heading">

                <span class="section-tag">
                    BOOKING
                </span>

                <h1>
                    Book Chende Seva
                </h1>

                <p>
                    Fill in your event details and submit your booking request.
                </p>

            </div>

            <div class="booking-card">

                <form id="bookingForm" class="form">

                    <label>
                        Full Name

                        <input
                            type="text"
                            name="customer_name"
                            required
                            autocomplete="name"
                            placeholder="Enter your full name"
                        >
                    </label>

                    <label>
                        Phone

                        <input
                            type="tel"
                            name="phone"
                            required
                            autocomplete="tel"
                            placeholder="Enter your phone number"
                        >
                    </label>

                    <label>
                        Email
                        <span class="optional">(Optional)</span>

                        <input
                            type="email"
                            name="email"
                            autocomplete="email"
                            placeholder="Enter your email address"
                        >
                    </label>

                    <label>
                        Event Type

                        <select name="event_type" required>
                            <option value="">Select</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Bhajan">Bhajan</option>
                            <option value="Procession">Procession</option>
                            <option value="Temple Event">Temple Event</option>
                            <option value="Cultural Program">Cultural Program</option>
                            <option value="Other">Other</option>
                        </select>
                    </label>

                    <label>
                        Event Date

                        <input
                            type="date"
                            name="event_date"
                            id="eventDate"
                            required
                        >
                    </label>

                    <label>
                        Start Time

                        <input
                            type="time"
                            name="start_time"
                            required
                        >
                    </label>

                    <label>

                        Venue / Location

                        <div class="location-control">

                            <input
                                type="text"
                                name="location"
                                id="location"
                                required
                                readonly
                                placeholder="Click the button to detect your location"
                            >

                            <button
                                type="button"
                                id="detectLocationBtn"
                                class="location-button"
                            >
                                📍 Detect My Location
                            </button>

                        </div>

                        <small
                            id="locationStatus"
                            class="muted"
                        >
                            Click "Detect My Location" and allow location access.
                        </small>

                    </label>

                    <input
                        type="hidden"
                        name="google_maps_link"
                        id="googleMapsLink"
                    >

                    <div
                        id="locationMapBox"
                        class="location-map-box"
                        style="display:none;"
                    >

                        <div class="location-success">
                            ✓ Location detected successfully
                        </div>

                        <a
                            id="openMapLink"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="text-link"
                        >
                            Open detected location in Google Maps ↗
                        </a>

                    </div>

                    <label>

                        Additional Requirements

                        <textarea
                            name="message"
                            rows="5"
                            placeholder="Any additional information..."
                        ></textarea>

                    </label>

                    <button
                        type="submit"
                        class="submit-button gold"
                        id="bookingSubmit"
                    >
                        Submit Booking Request ↗
                    </button>

                    <div
                        id="bookingMsg"
                        class="booking-message"
                        role="status"
                    ></div>

                    <div
                        id="bookingServiceStatus"
                        class="service-status"
                    >
                        <span class="dot"></span>
                        <span>Checking booking service...</span>
                    </div>

                </form>

            </div>

        </div>

    </section>

</main>

<script src="js/main.js"></script>

</body>
</html>
